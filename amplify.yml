version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - echo "Converting fix-amplify-build.js to CommonJS format for compatibility"
            - mv scripts/fix-amplify-build.js scripts/fix-amplify-build.mjs
            - echo "Running automatic build fixes for Amplify deployment"
            - node scripts/fix-amplify-build.mjs
            - echo "Installing dependencies"
            - npm install
        build:
          commands:
            - echo "Starting build process with database connection skipped"
            - echo "Setting production environment variables"
            - export NODE_ENV=production
            - export NEXT_TELEMETRY_DISABLED=1
            - export NEXT_BUILD_SKIP_DB=true
            - echo "Verifying critical environment variables"
            - |
              if [ -z "$DATABASE_URI" ]; then
                echo "ERROR: DATABASE_URI environment variable is not set"
                exit 1
              fi
            - |
              if [ -z "$PAYLOAD_SECRET" ]; then
                echo "ERROR: PAYLOAD_SECRET environment variable is not set"
                exit 1
              fi
            - echo "DATABASE_URI is configured: ${DATABASE_URI:0:20}..."
            - echo "Building Next.js application"
            - NODE_OPTIONS=--no-warnings npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    serverlessFunction:
      timeout: 60  # Lambda timeout in seconds
      memorySize: 1024  # Lambda memory in MB 